name: Release

# Pushing a tag like v1.1.0 builds the mod zip and publishes a GitHub release with it attached.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build mod zip
        run: |
          # vehicles/ and lua/ must sit at the top level of the zip for BeamNG to load it
          git archive --format=zip -o pillar_pod_gauges.zip "$GITHUB_SHA" vehicles lua
          unzip -l pillar_pod_gauges.zip

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" pillar_pod_gauges.zip --clobber
          else
            gh release create "$TAG" pillar_pod_gauges.zip \
              --title "Pillar Pod Digital Gauges ${TAG#v}" \
              --generate-notes
          fi
