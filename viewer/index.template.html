<!DOCTYPE html>
<!-- Pillar Pod Digital Gauges: event history viewer for recordings saved by the mod.
     GENERATED by tools/build_viewer.py from viewer/index.template.html and viewer/viewer.js; edit those.
     Works offline: open this file in a browser and drop a recording on it. Nothing is uploaded.
     Font: Barlow Semi Condensed, SIL Open Font License 1.1 (vehicles/common/pillar_pod_gauges/fonts/OFL.txt). -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pillar Pod · Event History</title>
<style>
/*@FONTS@*/
  html, body { margin: 0; height: 100%; background: #05080d; }
  .page { height: 100%; padding: 12px; box-sizing: border-box; }
  #app { height: 100%; }
  .open { background: #2e7cf6; color: #f4f6f8; border: 0; border-radius: 3px; padding: 8px 18px; font: 700 14px 'Barlow SC', Arial, sans-serif;
          letter-spacing: .06em; text-transform: uppercase; cursor: pointer; }
  .open:hover { background: #4b8ff8; }
</style>
</head>
<body>
<div class="page"><div id="app"></div></div>
<input type="file" id="file" accept=".json,application/json" hidden>
<script>
/*@VIEWER@*/
</script>
<script>
(function () {
  var stored = {};
  try { stored = JSON.parse(localStorage.getItem('ppv-units') || '{}'); } catch (e) {}
  var input = document.getElementById('file');
  var noFile = {listEvents: function () { return Promise.resolve({status: 'nofile'}); },
                getEvent: function () { return Promise.resolve(null); }, getLog: function () { return Promise.resolve(null); }};
  var viewer = PillarPodViewer.create(document.getElementById('app'), {
    source: noFile, units: stored, unitPicker: true, allowCSV: true, initialStatus: 'nofile',
    onUnits: function (u) { try { localStorage.setItem('ppv-units', JSON.stringify(u)); } catch (e) {} },
    buttons: [{id: 'open', label: 'Open', title: 'Open a recording', onClick: function () { input.click(); }}],
    noFileHTML: '<h3>Drop a recording here</h3>' +
      'In the game, press <b>Save</b> in the Event History app, or just drive: the mod also saves a few seconds after each event. ' +
      'The files are in<br><code>%LOCALAPPDATA%\\<wbr>BeamNG\\<wbr>BeamNG.drive\\<wbr>current\\<wbr>pillar_pod_gauges\\<wbr>recordings</code>' +
      '<div class="cta"><button class="open" type="button">Open recording</button></div>' +
      '<div style="margin-top:10px;font-size:12px">The file stays on this computer.</div>',
    onNoFileRendered: function (box) { var b = box.querySelector('.open'); if (b) b.onclick = function () { input.click(); }; }
  });
  function load(file) {
    var r = new FileReader();
    r.onload = function () {
      try {
        var rec = PillarPodViewer.parseRecording(String(r.result));
        document.title = 'Event History · ' + (rec.car || 'car') + ' · ' + (rec.started || '');
        viewer.setSource(PillarPodViewer.fileSource(rec));
      } catch (e) {
        viewer.setError((file.name ? file.name + ': ' : '') + (e.message || String(e)));
      }
    };
    r.onerror = function () { viewer.setError('Could not read ' + file.name + '.'); };
    r.readAsText(file);
  }
  input.onchange = function () { if (input.files[0]) load(input.files[0]); input.value = ''; };
  var depth = 0;
  document.addEventListener('dragenter', function (e) { e.preventDefault(); depth++; viewer.onDrag(true); });
  document.addEventListener('dragleave', function () { if (--depth <= 0) { depth = 0; viewer.onDrag(false); } });
  document.addEventListener('dragover', function (e) { e.preventDefault(); });
  document.addEventListener('drop', function (e) {
    e.preventDefault(); depth = 0; viewer.onDrag(false);
    if (e.dataTransfer.files[0]) load(e.dataTransfer.files[0]);
  });
  window.addEventListener('resize', function () { viewer.redraw(); });
  viewer.element.focus();
})();
</script>
</body>
</html>
