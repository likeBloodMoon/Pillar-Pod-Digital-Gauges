<!DOCTYPE html>
<!-- Pillar Pod Digital Gauges: event history viewer for recordings saved by the mod.
     GENERATED by tools/build_viewer.py from viewer/index.template.html and viewer/viewer.js; edit those.
     Works offline: open this file in a browser and drop a recording on it. Nothing is uploaded. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pillar Pod Digital Gauges · Event History</title>
<style>
  html, body { margin: 0; height: 100%; background: #07080a; color: #e8e8e8; font-family: 'Barlow', 'Segoe UI', Arial, sans-serif; }
  .page { display: flex; flex-direction: column; height: 100%; padding: 14px; box-sizing: border-box; gap: 10px; }
  .bar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .bar h1 { font-size: 16px; margin: 0; letter-spacing: .06em; }
  .bar h1 span { color: #ff2a1a; }
  .bar .hint { color: #8a8f98; font-size: 12px; flex: 1; min-width: 260px; }
  .bar code { background: #15181d; padding: 1px 5px; border-radius: 3px; color: #cfd3da; }
  .open { background: #ff2a1a; color: #fff; border: 0; border-radius: 4px; padding: 7px 14px; font-weight: 700; cursor: pointer; font-family: inherit; }
  .err { color: #ff5a3c; font-size: 13px; }
  #app { flex: 1; min-height: 0; }
  a { color: #3aa8ff; }
</style>
</head>
<body>
<div class="page">
  <div class="bar">
    <h1><span>PILLAR POD</span> EVENT HISTORY</h1>
    <div class="hint">Open a recording saved by the mod. In the game, press <b>Save</b> in the Event History app.
      The files are in <code>%LOCALAPPDATA%\BeamNG\BeamNG.drive\current\pillar_pod_gauges\recordings</code>.
      Nothing leaves your computer.</div>
    <input type="file" id="file" accept=".json,application/json" hidden>
    <button class="open" id="openBtn">Open recording</button>
  </div>
  <div class="err" id="err"></div>
  <div id="app"></div>
</div>
<script>
/*@VIEWER@*/
</script>
<script>
(function () {
  var stored = {};
  try { stored = JSON.parse(localStorage.getItem('ppv-units') || '{}'); } catch (e) {}
  var empty = {listEvents: function () { return Promise.resolve({events: [], note: 'Open a recording, or drop the file anywhere on this page.'}); },
               getEvent: function () { return Promise.resolve(null); }, getLog: function () { return Promise.resolve(null); }};
  var viewer = PillarPodViewer.create(document.getElementById('app'), {
    source: empty, units: stored, unitPicker: true, allowCSV: true,
    onUnits: function (u) { try { localStorage.setItem('ppv-units', JSON.stringify(u)); } catch (e) {} },
    emptyDetailHTML: '<b>No recording open</b><br>Open a file with the button above or drop it here.'
  });
  var err = document.getElementById('err');
  function load(file) {
    err.textContent = '';
    var r = new FileReader();
    r.onload = function () {
      try {
        var rec = PillarPodViewer.parseRecording(String(r.result));
        document.title = 'Event History · ' + (rec.car || 'car') + ' · ' + (rec.started || '');
        viewer.setSource(PillarPodViewer.fileSource(rec));
      } catch (e) { err.textContent = e.message || String(e); }
    };
    r.readAsText(file);
  }
  var input = document.getElementById('file');
  document.getElementById('openBtn').onclick = function () { input.click(); };
  input.onchange = function () { if (input.files[0]) load(input.files[0]); input.value = ''; };
  var depth = 0;
  document.addEventListener('dragenter', function (e) { e.preventDefault(); depth++; viewer.onDrag(true); });
  document.addEventListener('dragleave', function () { if (--depth <= 0) { depth = 0; viewer.onDrag(false); } });
  document.addEventListener('dragover', function (e) { e.preventDefault(); });
  document.addEventListener('drop', function (e) {
    e.preventDefault(); depth = 0; viewer.onDrag(false);
    if (e.dataTransfer.files[0]) load(e.dataTransfer.files[0]);
  });
  window.addEventListener('resize', function () { viewer.redraw(); });
})();
</script>
</body>
</html>
