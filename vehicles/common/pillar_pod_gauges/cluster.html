<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>pillar_pod_gauges digital cluster</title>
<script>
if (typeof beamng !== 'undefined') {
  window.onerror = function () {
    var s = "";
    for (var i = 0; i < arguments.length; i++) {
      if (arguments[i] !== null && arguments[i] !== undefined) s += arguments[i].toString() + " ";
    }
    s = s.replace(/'/g, "\\'").replace(/\n/g, " ");
    beamng.sendEngineLua("log('E','htmlTexture.pillar_pod_gauges_cluster','" + s + "')");
  };
}
</script>
<style>
  /* Barlow Semi Condensed, SIL Open Font License 1.1 (fonts/OFL.txt) */
  @font-face { font-family: "Barlow SC"; font-weight: 500; src: url("fonts/barlow-semi-condensed-latin-500-normal.woff2") format("woff2"); }
  @font-face { font-family: "Barlow SC"; font-weight: 600; src: url("fonts/barlow-semi-condensed-latin-600-normal.woff2") format("woff2"); }
  @font-face { font-family: "Barlow SC"; font-weight: 700; src: url("fonts/barlow-semi-condensed-latin-700-normal.woff2") format("woff2"); }
  html, body { margin: 0; padding: 0; background: #000; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c" width="1024" height="272"></canvas>
<script>
"use strict";
// Digital instrument cluster: a wide screen in place of the car's gauges. Speed, gear and a bar
// tachometer in the middle, fuel and coolant on the left, and the multi-function display pages on
// the right (same page button / binding: the electrics value dbg_mfd_page).
var W = 1024, H = 272;
var PAGES = ["Boost", "Tyres", "Engine", "Brakes", "G-Force"];
var cfg = { startPage: 0, nightBrightness: 0.25, egtWarn: 900, oilWarn: 130, waterWarn: 110, lowFuel: 10, shiftAt: 0.92 };
var units = { p: "bar", t: "c", metric: true, gal: false };
var FONT = '"Barlow SC", "Arial Narrow", Arial, sans-serif';

var cv = document.getElementById("c"), ctx = cv.getContext("2d");
var bg = document.createElement("canvas"); bg.width = W; bg.height = H;

var data = { e: {}, m: {} };
var powered = true, lights = 0, ambient = 1, page = 0, pageCounter = null;
var boostPeak = 0, gPeak = { lat: 0, lon: 0 }, gTrail = [], nominal = {};
var last = 0, clock = 0, bootT = -1, wasPowered = false, boost = 0;

// ---- colours, close to an automotive TFT: navy ground, white type, blue and red accents ----
var C = { white: "#f4f6f8", grey: "#8d99a8", dim: "#3b4757", blue: "#2e7cf6", sky: "#7cc4ff", red: "#e8262d",
          amber: "#f5b31a", green: "#7ed321", line: "#e8262d" };

// ---- units ----
function fmt(v, d) { return (isFinite(v) ? v : 0).toFixed(d); }
function tC(c) { return units.t === "f" ? c * 9 / 5 + 32 : c; }
function deg() { return units.t === "f" ? "°F" : "°C"; }
function pKpa(kpa) {
  if (units.p === "psi") return [kpa * 0.145038, 1, "psi"];
  if (units.p === "kpa") return [kpa, 0, "kPa"];
  return [kpa / 100, 1, "bar"];
}
function pPsi(psi) {
  if (units.p === "psi") return [psi, 1, "psi"];
  if (units.p === "kpa") return [psi * 6.89476, 0, "kPa"];
  return [psi * 0.0689476, 2, "bar"];
}
function dist(km) { return units.metric ? [km, "km"] : [km * 0.621371, "mi"]; }
function spd(ms) { return units.metric ? [ms * 3.6, "km/h"] : [ms * 2.23694, "mph"]; }
function vol(l) { return units.gal ? [l * 0.264172, "gal"] : [l, "L"]; }

// ---- drawing helpers ----
function font(size, weight) { ctx.font = (weight || 600) + " " + size + "px " + FONT; }
function txt(s, x, y, size, col, align, weight) {
  font(size, weight); ctx.fillStyle = col; ctx.textAlign = align || "center"; ctx.textBaseline = "alphabetic"; ctx.fillText(s, x, y);
}
function width(s, size, weight) { font(size, weight); return ctx.measureText(s).width; }
// a big number with a small unit after it, the pair centred / aligned as one
function valueUnit(v, u, x, y, size, col, align) {
  var wv = width(v, size, 700), wu = u ? width(u, size * 0.42, 600) + 4 : 0, w = wv + wu;
  var x0 = align === "left" ? x : (align === "right" ? x - w : x - w / 2);
  txt(v, x0, y, size, col, "left", 700);
  if (u) txt(u, x0 + wv + 4, y, size * 0.42, C.grey, "left", 600);
}
function rr(x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function heat(c, cold, warm, hot) { return c < cold ? C.sky : (c < warm ? C.white : (c < hot ? C.amber : C.red)); }

// background: dark navy with a faint hex texture, darker towards the edges
function buildBackground() {
  var g = bg.getContext("2d");
  g.fillStyle = "#070c15"; g.fillRect(0, 0, W, H);
  var rad = g.createRadialGradient(W / 2, H * 0.45, 40, W / 2, H * 0.45, H * 0.7);
  rad.addColorStop(0, "rgba(28,48,78,0.40)"); rad.addColorStop(1, "rgba(0,0,0,0)");
  g.fillStyle = rad; g.fillRect(0, 0, W, H);
  g.strokeStyle = "rgba(150,175,210,0.022)"; g.lineWidth = 1;
  var s = 7, h = s * Math.sqrt(3);
  for (var row = -1; row * h * 0.5 < H + h; row++) {
    for (var col = -1; col * s * 3 < W + s * 3; col++) {
      var cx = col * s * 3 + (row % 2 ? s * 1.5 : 0), cy = row * h * 0.5;
      g.beginPath();
      for (var k = 0; k < 6; k++) { var a = Math.PI / 3 * k; g[k ? "lineTo" : "moveTo"](cx + s * Math.cos(a), cy + s * Math.sin(a)); }
      g.closePath(); g.stroke();
    }
  }
}

// ---- small status icons ----
function icoTemp(x, y, col) {           // thermometer in waves (coolant)
  ctx.strokeStyle = col; ctx.fillStyle = col; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(x, y - 10); ctx.lineTo(x, y + 2); ctx.stroke();
  ctx.beginPath(); ctx.arc(x, y + 4, 3.2, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.moveTo(x + 2, y - 7); ctx.lineTo(x + 6, y - 7); ctx.moveTo(x + 2, y - 3); ctx.lineTo(x + 6, y - 3); ctx.stroke();
  ctx.lineWidth = 1.6; ctx.beginPath();
  for (var i = 0; i <= 16; i++) { var xx = x - 9 + i * 1.15; ctx[i ? "lineTo" : "moveTo"](xx, y + 10 + Math.sin(i * 0.8) * 1.4); }
  ctx.stroke();
}
function icoEngine(x, y, col) {
  ctx.strokeStyle = col; ctx.lineWidth = 2; ctx.lineJoin = "round"; ctx.beginPath();
  ctx.moveTo(x - 11, y - 1); ctx.lineTo(x - 8, y - 1); ctx.lineTo(x - 8, y - 5); ctx.lineTo(x - 3, y - 5); ctx.lineTo(x - 3, y - 8);
  ctx.lineTo(x + 3, y - 8); ctx.lineTo(x + 3, y - 5); ctx.lineTo(x + 7, y - 5); ctx.lineTo(x + 10, y - 8); ctx.lineTo(x + 12, y - 8);
  ctx.lineTo(x + 12, y + 6); ctx.lineTo(x + 10, y + 6); ctx.lineTo(x + 7, y + 3); ctx.lineTo(x + 6, y + 7); ctx.lineTo(x - 6, y + 7);
  ctx.lineTo(x - 8, y + 3); ctx.lineTo(x - 11, y + 3); ctx.closePath(); ctx.stroke();
}
function icoBrake(x, y, col) {
  ctx.strokeStyle = col; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(x, y, 7, 0, Math.PI * 2); ctx.stroke();
  ctx.beginPath(); ctx.arc(x, y, 11, Math.PI * 0.7, Math.PI * 1.3); ctx.stroke();
  ctx.beginPath(); ctx.arc(x, y, 11, -Math.PI * 0.3, Math.PI * 0.3); ctx.stroke();
  font(10, 700); ctx.fillStyle = col; ctx.textAlign = "center"; ctx.fillText("P", x, y + 4);
}
function icoLights(x, y, col) {
  ctx.strokeStyle = col; ctx.fillStyle = col; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(x + 1, y - 7); ctx.quadraticCurveTo(x + 10, y, x + 1, y + 7); ctx.closePath(); ctx.stroke();
  for (var i = -1; i <= 1; i++) { ctx.beginPath(); ctx.moveTo(x - 2, y + i * 4.5); ctx.lineTo(x - 10, y + i * 4.5 + 1.5); ctx.stroke(); }
}
function icoFuel(x, y, col) {
  ctx.strokeStyle = col; ctx.fillStyle = col; ctx.lineWidth = 2;
  rr(x - 7, y - 9, 10, 17, 1.5); ctx.stroke(); ctx.fillRect(x - 5, y - 7, 6, 5);
  ctx.beginPath(); ctx.moveTo(x + 3, y - 5); ctx.lineTo(x + 7, y - 2); ctx.lineTo(x + 7, y + 5); ctx.lineTo(x + 5, y + 5); ctx.stroke();
}
function icoClock(x, y, col) {
  ctx.strokeStyle = col; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(x, y, 8, 0, Math.PI * 2); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x, y - 5); ctx.lineTo(x, y); ctx.lineTo(x + 4, y + 2); ctx.stroke();
}
function icoOutside(x, y, col) {
  ctx.strokeStyle = col; ctx.fillStyle = col; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(x - 3, y - 9); ctx.lineTo(x - 3, y + 3); ctx.stroke();
  ctx.beginPath(); ctx.arc(x - 3, y + 5, 3.2, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(x + 6, y - 5, 3, 0, Math.PI * 2); ctx.stroke();
}

// car seen from above, drawn light like a studio render
function carTop(cx, cy, w, h) {
  ctx.save(); ctx.translate(cx, cy);
  ctx.shadowColor = "rgba(0,0,0,0.6)"; ctx.shadowBlur = 18;
  var body = ctx.createLinearGradient(-w / 2, 0, w / 2, 0);
  body.addColorStop(0, "#9aa6b4"); body.addColorStop(0.18, "#e9eef3"); body.addColorStop(0.5, "#ffffff");
  body.addColorStop(0.82, "#e9eef3"); body.addColorStop(1, "#9aa6b4");
  ctx.fillStyle = body;
  ctx.beginPath();                                       // body: rounded nose, slight waist, square tail
  ctx.moveTo(0, -h / 2);
  ctx.bezierCurveTo(w * 0.42, -h / 2, w / 2, -h * 0.44, w / 2, -h * 0.3);
  ctx.bezierCurveTo(w * 0.47, -h * 0.05, w * 0.47, h * 0.1, w / 2, h * 0.3);
  ctx.bezierCurveTo(w / 2, h * 0.45, w * 0.42, h / 2, 0, h / 2);
  ctx.bezierCurveTo(-w * 0.42, h / 2, -w / 2, h * 0.45, -w / 2, h * 0.3);
  ctx.bezierCurveTo(-w * 0.47, h * 0.1, -w * 0.47, -h * 0.05, -w / 2, -h * 0.3);
  ctx.bezierCurveTo(-w / 2, -h * 0.44, -w * 0.42, -h / 2, 0, -h / 2);
  ctx.fill(); ctx.shadowBlur = 0;
  ctx.fillStyle = "#1b2430";                             // glass
  ctx.beginPath(); ctx.moveTo(-w * 0.36, -h * 0.13); ctx.quadraticCurveTo(0, -h * 0.24, w * 0.36, -h * 0.13);
  ctx.lineTo(w * 0.31, -h * 0.02); ctx.quadraticCurveTo(0, -h * 0.07, -w * 0.31, -h * 0.02); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(-w * 0.32, h * 0.25); ctx.quadraticCurveTo(0, h * 0.3, w * 0.32, h * 0.25);
  ctx.lineTo(w * 0.28, h * 0.17); ctx.quadraticCurveTo(0, h * 0.2, -w * 0.28, h * 0.17); ctx.closePath(); ctx.fill();
  ctx.fillStyle = "#c5cfd9";                             // roof shading
  rr(-w * 0.3, -h * 0.01, w * 0.6, h * 0.17, 10); ctx.fill();
  ctx.fillStyle = "#cdd6df";                             // mirrors
  ctx.fillRect(-w / 2 - 6, -h * 0.13, 7, 8); ctx.fillRect(w / 2 - 1, -h * 0.13, 7, 8);
  ctx.strokeStyle = "rgba(0,0,0,0.12)"; ctx.lineWidth = 1;   // bonnet lines
  ctx.beginPath(); ctx.moveTo(-w * 0.18, -h * 0.46); ctx.lineTo(-w * 0.12, -h * 0.2); ctx.moveTo(w * 0.18, -h * 0.46); ctx.lineTo(w * 0.12, -h * 0.2); ctx.stroke();
  ctx.restore();
}

// ---- layout (1024 x 272 px). The Covet's cluster opening is a trapezoid and the steering wheel rim
// crosses its top corners, so everything sits inside the band the driver can actually see. ----
var TACH = { x0: 232, x1: 792, y: 24, h: 16, seg: 44 };
var LEFT = { x0: 104, x1: 352 };
var RIGHT = { x0: 672, x1: 936, top: 92 };
function label(s, x, y, align, col, size) { txt(s.toUpperCase(), x, y, size || 15, col || C.grey, align || "left", 600); }
function bandColour(c, cold, warm, hot) { return c < cold ? C.sky : (c < warm ? C.white : (c < hot ? C.amber : C.red)); }

function tach() {
  var e = data.e, rpm = Number(e.rpm) || 0, maxR = Math.max(3000, Number(e.maxrpm) || 7000);
  var top = Math.ceil((maxR + 500) / 1000) * 1000;           // at least half a thousand past the limit, shown red
  var n = TACH.seg, w = (TACH.x1 - TACH.x0) / n, red = maxR / top, shift = cfg.shiftAt * maxR / top;
  var lit = Math.max(0, Math.min(1, rpm / top)) * n;
  var flash = rpm >= cfg.shiftAt * maxR && Math.floor(clock * 10) % 2 === 0;
  for (var i = 0; i < n; i++) {
    var f = (i + 0.5) / n, x = TACH.x0 + i * w;
    var on = i < Math.floor(lit) || (i === Math.floor(lit) && lit % 1 > 0.5);
    var col = f >= red ? C.red : (f >= shift ? C.amber : C.blue);
    // segments grow slightly taller towards the redline, like a printed tach
    var hh = TACH.h * (0.6 + 0.4 * f);
    ctx.fillStyle = on ? (flash ? C.red : col) : (f >= red ? "#3a1518" : "#13294a");
    ctx.fillRect(x + 1, TACH.y + TACH.h - hh, w - 3, hh);
  }
  for (var k = 0; k <= top / 1000; k++) {
    var x0 = TACH.x0 + (TACH.x1 - TACH.x0) * k * 1000 / top;
    txt(String(k), x0, TACH.y + TACH.h + 22, 18, k * 1000 >= maxR ? C.red : C.grey, "center", 600);
  }
  label("x1000 rpm", TACH.x1 + 12, TACH.y + TACH.h - 1, "left", C.dim, 13);
}

function centre() {
  var e = data.e, sp = spd(Math.abs(Number(e.wheelspeed) || 0));
  txt(fmt(sp[0], 0), W / 2, 172, 112, C.white, "center", 700);
  label(sp[1], W / 2, 196, "center");
  ctx.strokeStyle = C.white; ctx.lineWidth = 2; rr(W / 2 - 26, 210, 52, 52, 8); ctx.stroke();
  ctx.fillStyle = "rgba(46,124,246,0.22)"; rr(W / 2 - 25, 211, 50, 50, 7); ctx.fill();
  txt(gearText(e.gear), W / 2, 249, 36, C.white, "center", 700);
  // telltales either side of the gear
  var water = Number(e.watertemp) || 0;
  icoEngine(W / 2 - 112, 238, Number(e.checkengine) > 0 ? C.amber : C.dim);
  icoBrake(W / 2 - 64, 238, Number(e.parkingbrake) > 0 ? C.red : C.dim);
  icoLights(W / 2 + 64, 238, lights > 0 ? C.green : C.dim);
  icoTemp(W / 2 + 108, 236, water >= cfg.waterWarn ? C.red : (water < 60 ? C.sky : C.dim));
}

function hbar(x, y, w, f, col, warnF) {
  ctx.fillStyle = "#16263d"; ctx.fillRect(x, y, w, 5);
  ctx.fillStyle = col; ctx.fillRect(x, y, w * Math.max(0, Math.min(1, f)), 5);
  if (warnF !== undefined && warnF !== null) { ctx.fillStyle = C.red; ctx.fillRect(x + w * warnF - 1, y - 3, 2, 11); }
}
function leftPanel() {
  var e = data.e, m = data.m, x0 = LEFT.x0, x1 = LEFT.x1, w = x1 - x0;
  var fv = vol(Number(e.fuelVolume) || 0), fuelP = Number(e.fuel) || 0; fuelP = fuelP > 1.5 ? fuelP / 100 : fuelP;
  var lowFuel = Number(e.lowfuel) > 0 || fuelP * 100 <= cfg.lowFuel;
  label("Fuel", x0, 108);
  valueUnit(fmt(fv[0], 0), fv[1], x1, 112, 30, lowFuel ? C.amber : C.white, "right");
  hbar(x0, 124, w, fuelP, lowFuel ? C.amber : C.sky, cfg.lowFuel / 100);
  var water = Number(e.watertemp) || 0;
  label("Coolant", x0, 166);
  valueUnit(fmt(tC(water), 0), deg(), x1, 170, 30, water >= cfg.waterWarn ? C.red : C.white, "right");
  hbar(x0, 182, w, (water - 40) / 90, water >= cfg.waterWarn ? C.red : C.sky, (cfg.waterWarn - 40) / 90);
  var rg = dist(Number(m.range) || 0);
  label("Range", x0, 226); valueUnit(m.range > 0 ? fmt(rg[0], 0) : "---", rg[1], x0, 252, 22, C.white, "left");
  label("Outside", x0 + 128, 226); valueUnit(typeof m.envT === "number" ? fmt(tC(m.envT), 0) : "---", deg(), x0 + 128, 252, 22, C.white, "left");
  label("Time", x1, 226, "right"); valueUnit(String(Math.min(Math.floor(clock / 60), 999)), "min", x1, 252, 22, C.white, "right");
}

// ---- right panel: one page of the multi-function display ----
function miniCar(cx, cy) {
  ctx.save(); ctx.translate(cx, cy); ctx.scale(0.42, 0.42); carTop(0, 0, 104, 226); ctx.restore();
}
function pBoost(x0, y0, w, h) {
  var m = data.m, psi = boost, lim = (typeof m.maxBoost === "number" && m.maxBoost > 0) ? m.maxBoost : 15;
  var u1 = pPsi(1)[0], vNow = psi * u1, vLim = lim * u1;
  var step = units.p === "psi" ? 5 : (units.p === "kpa" ? 50 : 0.5);
  var top = Math.max(step * 2, Math.ceil(lim * 1.3 * u1 / step) * step), vac = units.p === "psi" ? -10 : (units.p === "kpa" ? -60 : -0.8);
  var cx = x0 + 66, cy = y0 + 92, R = 60, a0 = Math.PI * 0.75, span = Math.PI * 1.5;
  function ang(vd) { var f = vd < 0 ? 0.2 * (1 - vd / vac) : 0.2 + 0.8 * Math.min(1, vd / top); return a0 + span * Math.max(0, Math.min(1, f)); }
  ctx.lineWidth = 6; ctx.strokeStyle = "#13294a"; ctx.beginPath(); ctx.arc(cx, cy, R, a0, a0 + span); ctx.stroke();
  var lit = ctx.createLinearGradient(cx - R, cy + R, cx + R, cy - R); lit.addColorStop(0, "#1d5fd6"); lit.addColorStop(1, "#9fd2ff");
  ctx.strokeStyle = lit; ctx.beginPath(); ctx.arc(cx, cy, R, a0, ang(vNow)); ctx.stroke();
  ctx.strokeStyle = C.red; ctx.beginPath(); ctx.arc(cx, cy, R, ang(vLim), a0 + span); ctx.stroke();
  var marks = [vac, 0]; for (var v = step; v <= top + 1e-6; v += step) marks.push(v);
  for (var i = 0; i < marks.length; i++) {
    var a = ang(marks[i]); ctx.strokeStyle = marks[i] > vLim ? C.red : C.white; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(cx + (R - 6) * Math.cos(a), cy + (R - 6) * Math.sin(a)); ctx.lineTo(cx + (R - 14) * Math.cos(a), cy + (R - 14) * Math.sin(a)); ctx.stroke();
  }
  var na = ang(vNow), nx = Math.cos(na), ny = Math.sin(na);
  ctx.fillStyle = C.red; ctx.beginPath(); ctx.moveTo(cx + nx * (R - 2), cy + ny * (R - 2));
  ctx.lineTo(cx + nx * 10 - ny * 3, cy + ny * 10 + nx * 3); ctx.lineTo(cx + nx * 10 + ny * 3, cy + ny * 10 - nx * 3); ctx.closePath(); ctx.fill();
  ctx.fillStyle = "#0a1220"; ctx.beginPath(); ctx.arc(cx, cy, 9, 0, Math.PI * 2); ctx.fill(); ctx.strokeStyle = "#24456f"; ctx.lineWidth = 1.5; ctx.stroke();
  var b = pPsi(psi), pk = pPsi(boostPeak);
  label("Turbo " + b[2], x0 + w, y0 + 52, "right");
  txt(fmt(b[0], b[1]), x0 + w, y0 + 100, 44, psi > lim ? C.red : C.white, "right", 700);
  label("max", x0 + w - 62, y0 + 132, "right"); txt(fmt(pk[0], pk[1]), x0 + w, y0 + 133, 20, C.white, "right", 700);
}
function quad(x0, y0, w, h, vals) {             // four corner readings around a small car
  miniCar(x0 + w / 2, y0 + 110);
  var spots = { FL: [x0, y0 + 78, "left"], FR: [x0 + w, y0 + 78, "right"], RL: [x0, y0 + 150, "left"], RR: [x0 + w, y0 + 150, "right"] };
  for (var n in spots) {
    var s = spots[n], r = vals(n);
    label(n + (r.unit ? "  " + r.unit : ""), s[0], s[1] - 26, s[2], C.grey, 13);
    txt(r.v, s[0], s[1], 28, r.col, s[2], 700);
    if (r.sub) txt(r.sub, s[0], s[1] + 20, 16, r.subCol || C.grey, s[2], 600);
  }
}
function pTyres(x0, y0, w, h) {
  var m = data.m, tp = m.tp || {}, tt = m.tt || {};
  quad(x0, y0, w, h, function (n) {
    var p = tp[n], t = tt[n], hasP = typeof p === "number", flat = hasP && p < 20, low = hasP && !flat && nominal[n] && p < nominal[n] * 0.8;
    var pv = pKpa(hasP ? p : 0);
    return { unit: pv[2], v: hasP ? (flat ? "0.0" : fmt(pv[0], pv[1])) : "---", col: flat ? C.red : (low ? C.amber : C.white),
             sub: typeof t === "number" ? fmt(tC(t), 0) + deg() : "---", subCol: typeof t === "number" ? bandColour(t, 40, 100, 120) : C.dim };
  });
}
function pBrakes(x0, y0, w, h) {
  var bt = data.m.bt || {};
  quad(x0, y0, w, h, function (n) {
    var b = bt[n], has = typeof b === "number";
    return { unit: deg(), v: has ? fmt(tC(b), 0) : "---", col: has ? bandColour(b, 80, 450, 700) : C.dim };
  });
}
function pEngine(x0, y0, w, h) {
  var e = data.e, m = data.m, oil = Number(e.oiltemp) || 0, egt = Number(m.egt) || 0, rpm = Number(e.rpm) || 0;
  var rows = [["Oil", tC(oil), deg(), (oil - 40) / 110, (cfg.oilWarn - 40) / 110, oil >= cfg.oilWarn],
              ["Exhaust gas", tC(egt), deg(), (egt - 100) / 900, (cfg.egtWarn - 100) / 900, egt >= cfg.egtWarn],
              ["Engine", rpm, "rpm", rpm / Math.max(1000, Number(e.maxrpm) || 7000), null, false]];
  for (var i = 0; i < rows.length; i++) {
    var r = rows[i], y = y0 + 52 + i * 48;
    label(r[0], x0, y, "left", C.grey, 14);
    valueUnit(fmt(r[1], 0), r[2], x0 + w, y + 2, 26, r[5] ? C.red : C.white, "right");
    hbar(x0, y + 12, w, r[3], r[5] ? C.red : C.sky, r[4]);
  }
}
function pG(x0, y0, w, h) {
  var m = data.m, cx = x0 + 66, cy = y0 + 92, R = 60, scale = 1.5;
  ctx.strokeStyle = "#24456f"; ctx.lineWidth = 1;
  for (var k = 1; k <= 3; k++) { ctx.beginPath(); ctx.arc(cx, cy, R * k / 3, 0, Math.PI * 2); ctx.stroke(); }
  ctx.beginPath(); ctx.moveTo(cx - R, cy); ctx.lineTo(cx + R, cy); ctx.moveTo(cx, cy - R); ctx.lineTo(cx, cy + R); ctx.stroke();
  var cl = function (v) { return Math.max(-1, Math.min(1, v / scale)); };
  if (gTrail.length > 1) {
    ctx.strokeStyle = "rgba(124,196,255,0.7)"; ctx.lineWidth = 1.5; ctx.beginPath();
    for (var i = 0; i < gTrail.length; i++) { var q = gTrail[i]; ctx[i ? "lineTo" : "moveTo"](cx + cl(q[0]) * R, cy - cl(q[1]) * R); }
    ctx.stroke();
  }
  var gx = Number(m.glat) || 0, gy = Number(m.glon) || 0;
  ctx.fillStyle = C.red; ctx.beginPath(); ctx.arc(cx + cl(gx) * R, cy - cl(gy) * R, 5, 0, Math.PI * 2); ctx.fill();
  label("Combined", x0 + w, y0 + 52, "right"); valueUnit(fmt(Math.sqrt(gx * gx + gy * gy), 2), "g", x0 + w, y0 + 96, 40, C.white, "right");
  label("Lat", x0 + w - 70, y0 + 120, "right", C.grey, 13); txt(fmt(gPeak.lat, 2), x0 + w - 70, y0 + 142, 18, C.white, "right", 700);
  label("Long", x0 + w, y0 + 120, "right", C.grey, 13); txt(fmt(gPeak.lon, 2), x0 + w, y0 + 142, 18, C.white, "right", 700);
}
function rightPanel() {
  var x0 = RIGHT.x0, w = RIGHT.x1 - RIGHT.x0, y0 = RIGHT.top - 20;
  label(PAGES[page], x0, RIGHT.top, "left", C.white, 16);
  [pBoost, pTyres, pEngine, pBrakes, pG][page](x0, y0, w, 168);
  for (var i = 0; i < PAGES.length; i++) {                 // page dots, right-aligned with the title
    ctx.fillStyle = i === page ? C.white : "#2b3746";
    var dx = RIGHT.x1 - (PAGES.length - 1 - i) * 14;
    if (i === page) { rr(dx - 6, RIGHT.top - 7, 12, 4, 2); ctx.fill(); }
    else { ctx.beginPath(); ctx.arc(dx, RIGHT.top - 5, 2.5, 0, Math.PI * 2); ctx.fill(); }
  }
}

// ---- frame ----
function gearText(g) {
  if (g === undefined || g === null || g === "") return "-";
  if (typeof g === "number") return g === 0 ? "N" : (g < 0 ? "R" : String(g));
  return String(g).toUpperCase();
}
function render() {
  ctx.globalAlpha = 1; ctx.fillStyle = "#000"; ctx.fillRect(0, 0, W, H);
  if (!powered) return;
  ctx.drawImage(bg, 0, 0);
  if (bootT >= 0) {
    var a = Math.min(1, bootT * 1.6); ctx.globalAlpha = a;
    txt("Pillar Pod", W / 2, H / 2 + 4, 40, C.white, "center", 700);
    label("Digital Gauges", W / 2, H / 2 + 34, "center");
    ctx.fillStyle = C.line; ctx.fillRect(W / 2 - 60 * a, H / 2 + 50, 120 * a, 2);
    ctx.globalAlpha = 1; dim(); return;
  }
  tach();
  ctx.fillStyle = "rgba(232,38,45,0.85)";                  // red rules framing the centre column
  ctx.fillRect(LEFT.x1 + 40, 96, 2, 160); ctx.fillRect(RIGHT.x0 - 42, 96, 2, 160);
  centre(); leftPanel(); rightPanel();
  dim();
}
function dim() {
  var d = lights > 0 ? cfg.nightBrightness : cfg.nightBrightness + (1 - cfg.nightBrightness) * ambient;
  if (d < 0.999) { ctx.globalAlpha = 1 - d; ctx.fillStyle = "#000"; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; }
}

// ---- BeamNG gauge API (called by lua/vehicle/controller/gauges/genericGauges.lua) ----
function setup(config) {
  config = config || {};
  for (var k in cfg) if (config[k] !== undefined && config[k] !== null && !isNaN(Number(config[k]))) cfg[k] = Number(config[k]);
  if (cfg.nightBrightness > 1) cfg.nightBrightness = cfg.nightBrightness / 100;
  var p = String(config.uiUnitPressure || "bar").toLowerCase();
  units.p = p === "psi" ? "psi" : (p === "kpa" ? "kpa" : "bar");
  units.t = String(config.uiUnitTemperature || "c").toLowerCase() === "f" ? "f" : "c";
  units.metric = String(config.uiUnitLength || "metric").toLowerCase() !== "imperial";
  units.gal = String(config.uiUnitVolume || "l").toLowerCase().indexOf("gal") === 0;
  page = ((cfg.startPage | 0) % PAGES.length + PAGES.length) % PAGES.length;
  render();
}

function updateData(d) {
  var e = (d && d.electrics) || {};
  var cm = (d && d.customModules) || {};
  var m = cm.dbgCluster || cm.dbgAmbient || {};
  var mfd = m.mfd || {};
  data.e = e;
  data.m = { maxBoost: m.maxBoost, egt: m.egt, tp: mfd.tp, tt: mfd.tt, bt: mfd.bt, ws: mfd.ws, glat: mfd.glat, glon: mfd.glon,
             range: mfd.range, envT: mfd.envT };
  var now = Date.now() / 1000, dt = last ? Math.min(0.2, now - last) : 0; last = now;
  var ign = e.ignitionLevel;
  powered = (ign === undefined || ign === null) ? true : (Number(ign) >= 1);
  if (powered && !wasPowered) { bootT = 0; clock = 0; boostPeak = 0; gPeak = { lat: 0, lon: 0 }; nominal = {}; }
  wasPowered = powered;
  if (bootT >= 0) { bootT += dt; if (bootT > 1.6) bootT = -1; }
  clock += dt;
  var pc = Number(e.dbg_mfd_page) || 0;                  // page button presses
  if (pageCounter === null) pageCounter = pc;
  if (pc !== pageCounter) { page = (page + ((pc - pageCounter) % PAGES.length) + PAGES.length) % PAGES.length; pageCounter = pc; }
  var turbo = Number(e.turboBoost) || 0, sc = Number(e.superchargerBoost) || 0;
  var b = sc > 0 ? Math.max(turbo, sc) : turbo;
  if (e.rpm !== undefined && Number(e.rpm) < 50) b = 0;  // engine stopped: atmospheric
  boost += (b - boost) * Math.min(1, dt * 12);
  if (boost > boostPeak) boostPeak = boost;
  var tp = data.m.tp || {};
  for (var n in tp) if (typeof tp[n] === "number" && tp[n] > 20 && clock < 4) nominal[n] = Math.max(nominal[n] || 0, tp[n]);
  var gx = Number(data.m.glat) || 0, gy = Number(data.m.glon) || 0;
  gTrail.push([gx, gy]); if (gTrail.length > 90) gTrail.shift();
  gPeak.lat = Math.max(gPeak.lat, Math.abs(gx)); gPeak.lon = Math.max(gPeak.lon, Math.abs(gy));
  lights = Math.max(Number(e.lights) || 0, Number(e.lowhighbeam) || 0);
  ambient = typeof m.light === "number" ? Math.max(0, Math.min(1, m.light)) : 1;
  render();
}

function updateMode(d) {}

buildBackground();
render();
if (document.fonts && document.fonts.load) {             // redraw once the bundled typeface is in
  Promise.all([document.fonts.load('500 20px "Barlow SC"'), document.fonts.load('600 20px "Barlow SC"'), document.fonts.load('700 20px "Barlow SC"')])
    .then(function () { render(); }, function () {});
}
