<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>pillar_pod_gauges</title>
<script>
if (typeof beamng !== 'undefined') {
  window.onerror = function () {
    var s = "";
    for (var i = 0; i < arguments.length; i++) {
      if (arguments[i] !== null && arguments[i] !== undefined) s += arguments[i].toString() + " ";
    }
    s = s.replace(/'/g, "\\'").replace(/\n/g, " ");
    beamng.sendEngineLua("log('E','htmlTexture.pillar_pod_gauges','" + s + "')");
  };
}
</script>
<style>
  html, body { margin: 0; padding: 0; background: #000; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c" width="512" height="512"></canvas>
<script>
"use strict";
// ---- configuration (overridable from the jbeam "configuration" section) ----
var NUMERIC = {zeroValue: 1, zeroLed: 1};   // null by default but numeric when set
var cfg = {
  source: "boost",    // "boost" (turbo/supercharger; min/max/warn in PSI), "oiltemp", "watertemp" or "egt" (deg C), "fuel" (percent),
                      // "rpm" (engine speed; min/max/warn in RPM, shown in thousands)
  decimals: 1,        // digits after the point (set automatically for boost from the unit)
  unit: "auto",       // boost only: "auto" follows the game's pressure unit setting, or force "psi", "bar", "kpa"
  zeroLed: null,      // fix the zero mark at this LED index (the scale above and below it stretches to fit)
  zeroValue: null,    // LEDs light outwards from this value; below it they show vacuum. null = same as minValue
  face: "black",      // "black", or "white" for the silver-bezel version (white faceplate is in the material)
  shiftLight: 0,      // boost gauge and tachometer: 1 = the whole LED ring flashes red near the rev limit
  shiftAt: 0.96,      // fraction of the engine's maximum RPM where the shift light starts (a value above 1 is a percentage)
  coldBelow: 0,       // temperature gauges: show a blue COLD mark below this temperature in deg C (0 = off)
  warnLow: 0,         // 1 = the warning is at the low end (fuel): red LEDs come first, digits flash at or below warnValue
  peakRecall: false,  // after a pull, flash the peak value on the display
  recallTime: 2.5,    // seconds the peak is shown
  recallMin: 3,       // a pull must exceed zero by this much to count
  minValue: 0,        // value at the first LED
  maxValue: 30,       // value at the last LED (tachometer: 0 = automatic, the red LEDs start at the engine's rev limit)
  ledCount: 24,
  warnLeds: 3,        // last N LEDs are red
  unitLabel: "PSI",
  titleLabel: "BOOST",
  unitScale: 1,       // electrics boost is in PSI; 0.0689476 would give bar
  warnValue: 26,      // overboost: digits flash at or above this value
  peakHold: 1.5,      // seconds the peak LED stays lit after boost drops
  nightBrightness: 0.25, // display brightness with the headlights on (1 = no dimming)
  bootTime: 1.3,      // seconds of start-up sweep when the ignition comes on
  shutdownSweep: 1,   // 1 = sweep the LED ring up and down and fade out when the ignition is switched off
  indicators: 1,      // 1 = PEAK and WARN lights under the title: PEAK when a new peak is set, WARN past the warning limit
  theme: 0,           // colour of the LED ring and digits: 0 green, 1 white, 2 amber, 3 blue, 4 purple, 5 super green (see THEMES)
  printedDigits: 1    // 1 = the unlit "8" segments are printed in the face texture; 0 = this page draws them
                      // (the EGT face, whose digit layout changes between 3 digits in deg C and 4 in deg F)
};

var cv = document.getElementById("c");
var ctx = cv.getContext("2d");
var W = 512, CX = 256, CY = 256;
var A0 = Math.PI * 0.75, SWEEP = Math.PI * 1.5;
var RED = "#ff1f14";
// Colour themes (Tuning -> Gauges: Colour). A theme changes the lit LED ring, the digits and the PEAK light.
// The warning colour stays red in every theme: the red LEDs, WARN, the shift light, and the digits while
// the reading is past its warning limit. led = ring, vac = vacuum side of the boost ring, digit = digits
// and decimal point, peak = PEAK light (blue, or white where the theme itself is blue). The glow themes
// also light the title and unit label in their colour (title, unit) and put a glowing rim round the face (rim).
var THEMES = [
  {led: "#35ff2e", vac: "#3aa8ff", digit: RED,       peak: "#3aa8ff"},   // 0 green ring, red digits (the original look)
  {led: "#eef2ff", vac: "#3aa8ff", digit: "#eef2ff", peak: "#3aa8ff"},   // 1 white
  {led: "#ffa514", vac: "#3aa8ff", digit: "#ffa514", peak: "#3aa8ff"},   // 2 amber
  {led: "#2f8fff", vac: "#e8eeff", digit: "#4aa8ff", peak: "#e8eeff"},   // 3 blue
  {led: "#a84cff", vac: "#5ad8ff", digit: "#b862ff", peak: "#7fe0ff",    // 4 purple
   title: "#e2d4ff", unit: "#c79bff", rim: "#a64dff"},
  {led: "#39ff3a", vac: "#3aa8ff", digit: "#4dff45", peak: "#3aa8ff",    // 5 super green
   title: "#dcffd8", unit: "#8dff6e", rim: "#2bff3a"}
];
var TH = THEMES[0];
// unlit parts printed on the face (and drawn by the page for the EGT digits): neutral grey, so every
// theme sits on the same face. Unlit red LEDs and WARN keep a red tint, since they are always red.
var UNLIT = "#242424", UNLIT_SEG = "#1b1b1b", UNLIT_RED = "#3a0f0b";

// 7-segment digit map: segments a b c d e f g
var SEG = {
  "0": "abcdef", "1": "bc", "2": "abdeg", "3": "abcdg", "4": "bcfg",
  "5": "acdfg", "6": "acdefg", "7": "abc", "8": "abcdefg", "9": "abcdfg",
  "-": "g", " ": ""
};
// sized for reading from the driver's seat, where the whole 52 mm face is only ~100 px across
var DW = 78, DH = 166, DT = 24, GAP = 18, PAD = 38;

function layer(w, h) {
  var c = document.createElement("canvas"); c.width = w; c.height = h; return c;
}

function segPoly(g, x0, y0, x1, y1, t) {
  var h = t / 2;
  g.beginPath();
  if (y0 === y1) {
    g.moveTo(x0, y0); g.lineTo(x0 + h, y0 - h); g.lineTo(x1 - h, y0 - h);
    g.lineTo(x1, y0); g.lineTo(x1 - h, y0 + h); g.lineTo(x0 + h, y0 + h);
  } else {
    g.moveTo(x0, y0); g.lineTo(x0 + h, y0 + h); g.lineTo(x0 + h, y1 - h);
    g.lineTo(x0, y1); g.lineTo(x0 - h, y1 - h); g.lineTo(x0 - h, y0 + h);
  }
  g.closePath(); g.fill();
}

function drawDigit(g, ch, x, y, onCol, offCol) {
  var on = SEG[ch] || "", w = DW, h = DH, t = DT, q = t * 0.12, m = y + h / 2;
  var segs = {
    a: [x + q, y, x + w - q, y], g: [x + q, m, x + w - q, m], d: [x + q, y + h, x + w - q, y + h],
    f: [x, y + q, x, m - q], b: [x + w, y + q, x + w, m - q],
    e: [x, m + q, x, y + h - q], c: [x + w, m + q, x + w, y + h - q]
  };
  g.save();
  g.transform(1, 0, -0.10, 1, 0.10 * (y + h / 2), 0);
  for (var k in segs) {
    var lit = on.indexOf(k) >= 0;
    if (lit ? !onCol : !offCol) continue;
    g.fillStyle = lit ? onCol : offCol;
    if (lit) { g.shadowColor = onCol; g.shadowBlur = 18; } else { g.shadowBlur = 0; }
    var s = segs[k];
    segPoly(g, s[0], s[1], s[2], s[3], t);
  }
  g.restore();
}

// digit x positions: three digits normally; exhaust temperature in deg F needs four (1370 deg F), drawn
// at 80 % size with tighter spacing so they fit the same window, like a 4-digit aftermarket EGT gauge
var TOTAL = DW * 3 + GAP * 2 + 14;
var DX3 = [CX - TOTAL / 2 + 6, CX - TOTAL / 2 + 6 + DW + GAP, CX - TOTAL / 2 + 6 + DW * 2 + GAP * 2 + 14];
var DY = 173;
var TITLE_Y = DY + DH + 52;   // baseline of the title (BOOST, OIL TEMP ...), also used for PEAK and COLD
var S4 = 0.8, GAP4 = 10, TOTAL4 = DW * S4 * 4 + GAP4 * 3;
var DX4 = [0, 1, 2, 3].map(function (k) { return CX - TOTAL4 / 2 + 4 + k * (DW * S4 + GAP4); });
var DY4 = DY + DH * (1 - S4) / 2;
var nDig = 3, DX = DX3, DS = 1, DYs = DY;
// PEAK and WARN indicator lights, in the gap at the bottom of the LED ring under the title
var IND_Y = TITLE_Y + 50, IND_DX = 50, IND_FONT = "bold 27px Arial, Helvetica, sans-serif";
var WARN_COL = "#ff2a1a";
function hasPeakLight() { return cfg.indicators > 0 && cfg.warnLow <= 0; }   // a fuel gauge has no peak to show
function warnX() { return hasPeakLight() ? CX + IND_DX : CX; }                  // WARN alone is centred
function drawIndicator(g, label, x, col, glow) {
  g.save();
  g.font = IND_FONT; g.textAlign = "center"; g.fillStyle = col;
  if (glow) { g.shadowColor = col; g.shadowBlur = 14; }
  g.fillText(label, x, IND_Y);
  g.restore();
}  // active layout: digit count, x positions, scale, top
function setDigits(n) {
  nDig = n; DX = n === 4 ? DX4 : DX3; DS = n === 4 ? S4 : 1; DYs = n === 4 ? DY4 : DY;
}
function unlitDigits(g) {                        // the dark "8"s behind the lit segments
  for (var d = 0; d < nDig; d++) {
    g.save(); g.translate(DX[d], DYs); g.scale(DS, DS);
    drawDigit(g, "8", 0, 0, UNLIT_SEG, null);
    g.restore();
  }
}

// ---- pre-rendered layers: everything expensive (glow) is drawn once ----
var bgOn, bgOff, ledSprites = [], ledSpritesRed = [], digitSprites = {}, digitSpritesWarn = {}, indSprites = {};

function zeroLed() {     // index of the first LED above zero (0 when there is no vacuum zone)
  if (typeof cfg.zeroLed === "number") return cfg.zeroLed;   // fixed, so it matches the printed faceplate
  var z = (cfg.zeroValue === null || cfg.zeroValue === undefined) ? cfg.minValue : cfg.zeroValue;
  return Math.max(0, Math.round((z - cfg.minValue) / (effMax() - cfg.minValue) * cfg.ledCount));
}

function ledAngle(i) { return A0 + SWEEP * (i / (cfg.ledCount - 1)); }

function drawLed(g, i, col, glow) {
  var a = ledAngle(i);
  g.save();
  g.translate(CX + Math.cos(a) * 216, CY + Math.sin(a) * 216);
  g.rotate(a);
  g.fillStyle = col;
  if (glow) { g.shadowColor = col; g.shadowBlur = 22; }
  g.fillRect(-17, -11, 34, 22);
  g.restore();
}

function isMajor(i) {
  var n = cfg.ledCount, z = zeroLed();
  return z > 0 ? ((i - z) % 6 === 0 || i === n - 1) : ((i % 4 === 0) || i === n - 1);
}

// The emissive layer: ONLY things that actually give off light. The background is pure black so the
// gauge face does not glow at night; unlit LEDs, unlit segments and the faceplate are printed in the
// material's static base-colour texture instead (see buildStaticFace).
function buildBackground(on) {
  var c = layer(W, W), g = c.getContext("2d"), n = cfg.ledCount;
  g.fillStyle = "#000"; g.fillRect(0, 0, W, W);
  if (!on) return c;
  if (TH.rim) {                                  // glow themes: a lit ring round the edge of the face
    g.save();
    g.strokeStyle = TH.rim; g.lineWidth = 5; g.shadowColor = TH.rim; g.shadowBlur = 18;
    g.beginPath(); g.arc(CX, CY, 247, 0, Math.PI * 2); g.stroke();
    g.globalAlpha = 0.5; g.lineWidth = 2; g.beginPath(); g.arc(CX, CY, 239, 0, Math.PI * 2); g.stroke();
    g.restore();
  }
  if (cfg.face !== "white") {                    // backlit tick marks (printed on the white faceplate)
    var z = zeroLed();
    for (var i = 0; i < n; i++) {
      var a = ledAngle(i), major = isMajor(i);
      g.save();
      g.translate(CX + Math.cos(a) * (major ? 184 : 187), CY + Math.sin(a) * (major ? 184 : 187));
      g.rotate(a);
      g.fillStyle = (z > 0 && i === z) ? "#ffb300" : "#e8e8e8";
      g.fillRect(major ? -9 : -5, -2, major ? 18 : 10, 4);
      g.restore();
    }
  }
  g.textAlign = "center";
  g.fillStyle = TH.title || "#f2f2f2";
  g.font = "bold 40px Arial, Helvetica, sans-serif";
  g.fillText(cfg.titleLabel, CX, TITLE_Y);
  g.fillStyle = TH.unit || "#ffb300";
  g.font = "bold 36px Arial, Helvetica, sans-serif";
  g.fillText(cfg.unitLabel, CX, DY - 16);
  if (!cfg.printedDigits) { unlitDigits(g); g.shadowBlur = 0; }
  return c;
}

// The printed face, used to bake the material's base-colour textures (not used at runtime).
function buildStaticFace(white) {
  var c = layer(W, W), g = c.getContext("2d"), n = cfg.ledCount, z = zeroLed(), i, a;
  g.fillStyle = "#000"; g.fillRect(0, 0, W, W);
  if (white) {
    g.beginPath(); g.arc(CX, CY, 255, 0, 7); g.fillStyle = "#b2b2ae"; g.fill();      // faceplate
    g.beginPath(); g.arc(CX, CY, 180, 0, 7); g.fillStyle = "#080808"; g.fill();      // display window (fits the larger digits)
    g.lineWidth = 3; g.strokeStyle = "#7a7a76"; g.stroke();
  } else {
    g.beginPath(); g.arc(CX, CY, 255, 0, 7); g.fillStyle = "#0b0b0c"; g.fill();
  }
  for (i = 0; i < n; i++) {
    a = ledAngle(i);
    if (white) {                                  // dark window behind each LED + printed ticks
      g.save(); g.translate(CX + Math.cos(a) * 216, CY + Math.sin(a) * 216); g.rotate(a);
      g.fillStyle = "#060606"; g.fillRect(-20, -14, 40, 28); g.restore();
      var major = isMajor(i);
      g.save(); g.translate(CX + Math.cos(a) * (major ? 186 : 188), CY + Math.sin(a) * (major ? 186 : 188)); g.rotate(a);
      g.fillStyle = (z > 0 && i === z) ? "#c03000" : "#111"; g.fillRect(major ? -9 : -5, -2, major ? 18 : 10, 4); g.restore();
    }
    drawLed(g, i, isRed(i) ? UNLIT_RED : UNLIT, false);   // unlit LEDs
  }
  if (cfg.printedDigits) for (var d = 0; d < 3; d++) drawDigit(g, "8", DX3[d], DY, UNLIT_SEG, null);   // unlit segments
  if (cfg.indicators > 0) {                       // unlit PEAK and WARN lights
    var marks = [["WARN", warnX(), UNLIT_RED]];
    if (hasPeakLight()) marks.unshift(["PEAK", CX - IND_DX, UNLIT]);
    marks.forEach(function (m) {
      if (white) { g.fillStyle = "#060606"; g.fillRect(m[1] - 42, IND_Y - 27, 84, 35); }   // dark window in the faceplate
      drawIndicator(g, m[0], m[1], m[2], false);
    });
  }
  g.shadowBlur = 0;
  return c;
}

function digitSet(col) {                         // glowing digit sprites and decimal point in one colour
  var set = {};
  for (var ch in SEG) {
    if (ch === " ") continue;
    var dc = layer(DW + PAD * 2 + 16, DH + PAD * 2), dg = dc.getContext("2d");
    drawDigit(dg, ch, PAD + 8, PAD, col, null);
    set[ch] = dc;
  }
  var pc = layer(60, 60), pg = pc.getContext("2d");
  pg.fillStyle = col; pg.shadowColor = col; pg.shadowBlur = 16;
  pg.beginPath(); pg.arc(30, 30, 13, 0, Math.PI * 2); pg.fill();
  set["."] = pc;
  return set;
}

function buildLayers() {
  TH = THEMES[Math.max(0, Math.min(THEMES.length - 1, Math.round(Number(cfg.theme) || 0)))];
  bgOn = buildBackground(true);
  bgOff = buildBackground(false);
  ledSprites = []; ledSpritesRed = [];
  for (var i = 0; i < cfg.ledCount; i++) {
    // crop to the LED's neighbourhood so blits stay small
    var a = ledAngle(i), x = Math.round(CX + Math.cos(a) * 216 - 50), y = Math.round(CY + Math.sin(a) * 216 - 50);
    var cols = [isRed(i) ? "#ff2a1a" : (i < zeroLed() ? TH.vac : TH.led), "#ff2a1a"];
    for (var k = 0; k < 2; k++) {                 // normal colour, and all-red for the shift light
      var c = layer(W, W), g = c.getContext("2d");
      drawLed(g, i, cols[k], true);
      var s = layer(100, 100); s.getContext("2d").drawImage(c, -x, -y);
      (k === 0 ? ledSprites : ledSpritesRed).push({img: s, x: x, y: y});
    }
  }
  digitSprites = digitSet(TH.digit);
  digitSpritesWarn = TH.digit === RED ? digitSprites : digitSet(RED);   // past the warning limit the digits go red
  indSprites = {};
  [["PEAK", CX - IND_DX, TH.peak], ["WARN", warnX(), WARN_COL]].forEach(function (d) {
    var ic = layer(140, 70), ig = ic.getContext("2d");
    ig.translate(70 - d[1], 50 - IND_Y);
    drawIndicator(ig, d[0], d[1], d[2], true);
    indSprites[d[0]] = {img: ic, x: d[1] - 70, y: IND_Y - 50};
  });
}

// ---- state ----
var target = 0;          // latest boost from the game
var arcVal = 0;          // eased value driving the LED arc
var digitVal = 0;        // value shown on the digits (refreshed ~12x per second)
var digitTimer = 0;
var powered = false, wasPowered = false;
var lights = 0;          // headlights on -> dimmed display
var bootT = -1;          // >= 0 while the start-up sweep is running
var peakPos = 0;         // peak-hold marker, in LED units
var peakTimer = 0;
var clock = 0;           // seconds, for the overboost flash
var shifting = false;    // engine speed is at the shift point
var ambient = 1;         // 1 = daylight .. 0 = night (from the mod's ambient light module)
// the ambient light changes in steps (the module asks the game a few times a second, and dragging the
// time of day jumps it around), so the brightness follows it smoothly instead of flashing
var ambShown = -1;
function easeAmbient(dt) { if (ambShown >= 0) ambShown += (ambient - ambShown) * Math.min(1, dt / AMB_FADE); }
function ambNow() { return ambShown < 0 ? ambient : ambShown; }   // the first reading after spawning is taken as it is
var AMB_FADE = 1.0;      // seconds
var runPeak = -1e9;      // highest value of the current pull
var storedPeak = -1e9;   // highest value since the car was spawned
var sesPeak = -1e9;      // highest value since the ignition came on (for the PEAK light)
var peakLitT = 0;        // seconds the PEAK light stays on
var overRev = false;     // tachometer: engine speed at or past the shift point (lights WARN)
var haveNow = true;      // the car reported this gauge's reading in the latest update
var missT = 0, missing = false;   // no reading for half a second: the gauge shows dashes and a dark ring
function dashes() { return nDig === 4 ? "----" : "---"; }
var offBoost = 0;        // seconds spent back at/below zero
var recallT = -1;        // >= 0 while the peak is being shown
var recallVal = 0;
var OFF_TIME = 1.0;      // seconds of shut-down sweep
var offT = -1;           // >= 0 while the shut-down sweep is running (ignition just switched off)
var offFrom = 0, offTxt = "", offDot = -1;   // LED position and digits when the ignition went off
var onT = 0;             // seconds the ignition has been on
var resets = null, quietT = 0;   // vehicle resets (from dbgAmbient): no shut-down sweep right after one
var lastT = 0;
var lastKey = "";

var tempF = false;       // temperatures follow the game's temperature unit setting
function isTemp() { return cfg.source === "oiltemp" || cfg.source === "watertemp" || cfg.source === "egt"; }
function isRed(i) { return cfg.warnLow > 0 ? i < cfg.warnLeds : i >= cfg.ledCount - cfg.warnLeds; }
function warning(v) { return cfg.warnLow > 0 ? (cfg.warnValue > 0 && v <= cfg.warnValue) : v >= effWarn(); }
var pUnit = "psi";       // boost follows the game's pressure unit setting (or cfg.unit)
function shown(value) {
  if (isTemp()) {
    return tempF ? value * 9 / 5 + 32 : value;
  }
  if (cfg.source === "fuel") return value;
  if (cfg.source === "rpm") return value / 1000;   // tachometer: thousands, one decimal (6.8)
  if (pUnit === "bar") return value * 0.0689476;
  if (pUnit === "kpa") return value * 6.89476;
  return value;
}

// returns three (or four) characters plus the index of the digit the decimal point follows (-1 = none)
function digitText(value) {
  value = shown(value);
  if (nDig === 4) {                              // whole numbers up to 9999, right-aligned
    var w4 = Math.round(value), t4 = String(Math.min(9999, Math.abs(w4)));
    if (w4 < 0) t4 = "-" + t4.slice(0, 3);
    while (t4.length < 4) t4 = " " + t4;
    return [t4, -1];
  }
  var d = cfg.decimals;
  if (d >= 2 && (value < -0.004 || Math.abs(value) >= 9.995)) d = 1;   // "-0.3", "12.5"
  if (d < 1) {
    var w = Math.round(value), t = String(Math.min(999, Math.abs(w)));
    if (w < 0) t = "-" + t.slice(0, 2);
    while (t.length < 3) t = " " + t;
    return [t, -1];
  }
  if (d >= 2) {
    var h = Math.round(value * 100);
    return [String(Math.floor(h / 100)) + ("0" + (h % 100)).slice(-2), 0];
  }
  var v = Math.round(value * 10) / 10;
  if (Math.abs(v) < 0.05) v = 0;
  var neg = v < 0, parts = Math.abs(v).toFixed(1).split("."), ip = parts[0];
  if (ip.length > 2) { ip = "99"; parts[1] = "9"; }
  if (ip.length < 2) ip = (neg ? "-" : " ") + ip;
  return [ip + parts[1], 1];
}

// LED scale maximum and overboost warning: a slider value above 0 wins; 0 means automatic, taken from
// the turbo's wastegate limit (red LEDs then start just above it); with no turbo data, fixed defaults.
var autoLimit = 0;       // wastegate limit in PSI from the car's jbeam data (0 = unknown)
var autoRpm = 0;         // tachometer: the engine's maximum RPM from the game (0 = unknown)
function effMax() {
  if (cfg.source === "rpm") {                    // the last 3 of 24 LEDs (the red ones) are past the rev limit
    if (cfg.maxValue > 0) return cfg.maxValue;
    return Math.round((autoRpm > 0 ? Math.max(3000, autoRpm) : 7000) * cfg.ledCount / (cfg.ledCount - cfg.warnLeds) / 100) * 100;
  }
  if (cfg.source !== "boost") return cfg.maxValue;
  if (cfg.maxValue > 0) return cfg.maxValue;
  return autoLimit > 0 ? Math.max(8, Math.round(autoLimit * 1.25 * 2) / 2) : 30;
}
function effWarn() {
  if (cfg.source === "rpm") return cfg.warnValue > 0 ? cfg.warnValue : 1e9;   // the shift light is the tachometer's warning
  if (cfg.source !== "boost") return cfg.warnValue;
  if (cfg.warnValue > 0) return cfg.warnValue;
  return autoLimit > 0 ? Math.max(autoLimit * 1.1, autoLimit + 2) : 26;
}

function ledPos(value) {
  var n = cfg.ledCount, z = zeroLed();
  var zv = (cfg.zeroValue === null || cfg.zeroValue === undefined) ? cfg.minValue : cfg.zeroValue;
  var p;
  if (z > 0 && value < zv) p = z * (value - cfg.minValue) / (zv - cfg.minValue);        // vacuum zone
  else p = z + (n - z) * (value - zv) / (effMax() - zv);                           // from zero up to max
  return Math.max(0, Math.min(n, p));
}

function render() {
  var n = cfg.ledCount, z = zeroLed();
  var booting = powered && bootT >= 0, recalling = powered && !booting && recallT >= 0;
  var shutting = !powered && offT >= 0, u = 0, digA = 1, bgA = 1;
  var pos = 0, txt = "", dot = -1, peak = -1, digitsOn = true, ledsOn = true, sweep = false, warnDig = false;
  if (booting) {
    // LEDs run up and back down, digits show 88.8
    var u = bootT / cfg.bootTime;
    var tri = u < 0.5 ? u * 2 : (1 - u) * 2;
    pos = n * (tri * tri * (3 - 2 * tri));
    txt = nDig === 4 ? "8888" : "888"; sweep = true;
    digitsOn = u < 0.8 || Math.floor(u * 40) % 2 === 0;
  } else if (recalling) {
    // peak recall: digits hold the peak, the outer LEDs flash up to it
    pos = ledPos(recallVal);
    var dt0 = digitText(recallVal); txt = dt0[0]; dot = dt0[1];
    ledsOn = Math.floor(recallT * 6) % 2 === 0;
  } else if (shutting) {
    // shut-down: the ring sweeps up to full and back to empty while the digits and backlight fade out
    u = Math.min(1, offT / OFF_TIME);
    var up = Math.min(1, u / 0.4), down = Math.max(0, (u - 0.4) / 0.6);
    pos = u < 0.4 ? offFrom + (n - offFrom) * (up * up * (3 - 2 * up)) : n * (1 - down * down * (3 - 2 * down));
    txt = offTxt; dot = offDot; sweep = true;
    digA = 1 - u;
    bgA = u < 0.5 ? 1 : 1 - (u - 0.5) / 0.5;
  } else if (powered && missing) {
    // the car doesn't report this reading: dashes, and the ring stays dark
    txt = dashes(); ledsOn = false;
  } else if (powered) {
    pos = ledPos(arcVal);                        // e.g. 13.4 = 13 LEDs full, the 14th at 40%
    var dt1 = digitText(digitVal); txt = dt1[0]; dot = dt1[1];
    if (cfg.peakHold > 0 && peakPos > Math.max(pos, z) + 0.6) peak = Math.min(n - 1, Math.ceil(peakPos) - 1);
    if (warning(arcVal)) { digitsOn = Math.floor(clock * 12) % 2 === 0; warnDig = true; }   // overboost / overheat / low fuel: flash in red
  }
  var shiftOn = powered && !booting && shifting;
  var shiftPhase = shiftOn ? Math.floor(clock * 10) % 2 : 0;
  var cold = powered && !booting && !missing && isTemp() && cfg.coldBelow > 0 && target < cfg.coldBelow;
  // indicator lights: both on during the start-up test, like the digits
  var peakOn = false, warnOn = false;
  if (cfg.indicators > 0) {
    if (booting) { peakOn = hasPeakLight() && digitsOn; warnOn = digitsOn; }
    else if (powered && !missing) {
      peakOn = peakLitT > 0;
      warnOn = warning(arcVal) || (cfg.source === "rpm" && overRev);
    }
  }
  // brightness: headlights on -> night level; otherwise follow the ambient light
  var dim = 1;
  if (powered || shutting) dim = lights > 0 ? cfg.nightBrightness : cfg.nightBrightness + (1 - cfg.nightBrightness) * ambNow();
  var key = (powered ? "1" : "0") + Math.round(pos * 25) + txt + dot + peak + (digitsOn ? "d" : "x") + (ledsOn ? "l" : "o") +
            (recalling ? "r" : "") + Math.round(dim * 50) + (shiftOn ? "s" + shiftPhase : "") + (cold ? "c" : "") +
            (shutting ? "o" + Math.round(u * 60) : "") + (peakOn ? "P" : "") + (warnOn ? "W" : "") + (missing ? "m" : "") + (warnDig ? "w" : "");
  if (key === lastKey) return;                  // nothing visible changed
  lastKey = key;

  ctx.globalAlpha = 1;
  ctx.drawImage(powered ? bgOn : bgOff, 0, 0);
  if (shutting && bgA > 0) { ctx.globalAlpha = bgA; ctx.drawImage(bgOn, 0, 0); ctx.globalAlpha = 1; }
  if (!powered && !shutting) return;
  if (shiftOn) {                                // shift light: the whole ring flashes red
    if (shiftPhase === 0) {
      for (var q = 0; q < n; q++) { var rs = ledSpritesRed[q]; ctx.drawImage(rs.img, rs.x, rs.y); }
    }
  } else if (ledsOn) {
    for (var i = 0; i < n; i++) {
      var b;
      if (sweep) b = pos - i;                              // start-up: everything from the first LED
      else if (i >= z) b = pos - i;                        // boost side: fills upwards from zero
      else b = (pos < z) ? (i + 1 - pos) : 0;              // vacuum side: fills downwards from zero
      if (b <= 0) continue;
      ctx.globalAlpha = b >= 1 ? 1 : b;
      var s = ledSprites[i];
      ctx.drawImage(s.img, s.x, s.y);
    }
  }
  ctx.globalAlpha = 1;
  if (peak >= 0 && !shiftOn) { var ps = ledSprites[peak]; ctx.drawImage(ps.img, ps.x, ps.y); }
  if (cold) {                                   // oil not up to temperature yet
    ctx.fillStyle = "#000"; ctx.fillRect(CX - 120, TITLE_Y - 36, 240, 46);     // in place of the title
    ctx.fillStyle = "#3aa8ff"; ctx.textAlign = "center";
    ctx.font = "bold 40px Arial, Helvetica, sans-serif";
    ctx.fillText("COLD", CX, TITLE_Y);
  }
  if (digitsOn && digA > 0.01) {
    ctx.globalAlpha = digA;
    var dset = warnDig ? digitSpritesWarn : digitSprites;
    for (var d = 0; d < nDig; d++) {
      var sp = dset[txt[d]];
      if (sp) ctx.drawImage(sp, DX[d] - (PAD + 8) * DS, DYs - PAD * DS, sp.width * DS, sp.height * DS);
    }
    if (booting && nDig === 3) dot = 1;
    if (dot >= 0) ctx.drawImage(dset["."], DX[dot] + DW + (dot === 0 ? 9 : 12) - 30, DY + DH + 1 - 30);
    ctx.globalAlpha = 1;
  }
  if (peakOn) { var pk = indSprites.PEAK; ctx.drawImage(pk.img, pk.x, pk.y); }
  if (warnOn) { var wn = indSprites.WARN; ctx.drawImage(wn.img, wn.x, wn.y); }
  if (recalling) {                              // swap the title for "PEAK"
    ctx.fillStyle = "#000"; ctx.fillRect(CX - 120, TITLE_Y - 36, 240, 46);
    ctx.fillStyle = "#ffb300"; ctx.textAlign = "center";
    ctx.font = "bold 40px Arial, Helvetica, sans-serif";
    ctx.fillText("PEAK", CX, TITLE_Y);
  }
  if (dim < 0.99) {                             // darken the whole display
    ctx.globalAlpha = 1 - dim;
    ctx.fillStyle = "#000"; ctx.fillRect(0, 0, W, W);
    ctx.globalAlpha = 1;
  }
}

function tick() {
  var now = (window.performance && performance.now) ? performance.now() : Date.now();
  var dt = lastT ? Math.min(0.1, (now - lastT) / 1000) : 0.016;
  if (lastT && now - lastT < 4) return;          // called from both the timer and the game; skip doubles
  lastT = now;
  clock += dt;
  easeAmbient(dt);

  if (powered && !wasPowered) { bootT = 0; offT = -1; arcVal = 0; digitVal = 0; peakPos = 0; sesPeak = -1e9; peakLitT = 0; }
  // ignition switched off after running a while: shut-down sweep (not after a reset, and not when the
  // engine just stalls, since the ignition stays on then)
  missT = haveNow ? 0 : missT + dt;
  missing = missT > 0.5;
  if (!powered && wasPowered && cfg.shutdownSweep > 0 && onT > 0.5 && quietT <= 0) {
    offT = 0; offFrom = (bootT >= 0 || missing) ? 0 : ledPos(arcVal);
    var t0 = missing ? [dashes(), -1] : digitText(digitVal); offTxt = bootT >= 0 ? "" : t0[0]; offDot = bootT >= 0 ? -1 : t0[1];
    bootT = -1; recallT = -1;
  }
  onT = powered ? onT + dt : 0;
  quietT = Math.max(0, quietT - dt);
  wasPowered = powered;
  if (offT >= 0) { offT += dt; if (offT >= OFF_TIME || powered) { offT = -1; lastKey = ""; } }
  if (bootT >= 0) { bootT += dt; if (bootT >= cfg.bootTime || !powered) bootT = -1; }

  // time-based easing: same feel at any frame rate
  arcVal += (target - arcVal) * (1 - Math.exp(-dt / 0.07));
  if (Math.abs(target - arcVal) < 0.005) arcVal = target;
  digitTimer += dt;
  if (digitTimer >= 0.08) { digitTimer = 0; digitVal = arcVal; }

  // peak recall: once a pull is over (back at or below zero), show its peak for a moment
  if (cfg.peakRecall && cfg.recallTime > 0 && powered && bootT < 0) {
    var zv = (cfg.zeroValue === null || cfg.zeroValue === undefined) ? cfg.minValue : cfg.zeroValue;
    if (arcVal > runPeak) runPeak = arcVal;
    if (target <= zv + 0.5) offBoost += dt; else { offBoost = 0; if (target > zv + 1.5) recallT = -1; }
    if (recallT < 0 && offBoost > 0.6 && runPeak >= zv + cfg.recallMin) {
      recallT = 0; recallVal = runPeak; storedPeak = Math.max(storedPeak, runPeak); runPeak = -1e9;
    }
    if (recallT >= 0) { recallT += dt; if (recallT >= cfg.recallTime) recallT = -1; }
  } else { recallT = -1; }

  // PEAK light: comes on for a moment whenever the reading sets a new high for this drive in the top
  // part of the scale (so a warming engine or idling doesn't keep it lit)
  peakLitT = Math.max(0, peakLitT - dt);
  if (hasPeakLight() && powered && bootT < 0 && offT < 0) {
    var span = effMax() - cfg.minValue, top = cfg.minValue + span * 0.6;
    if (arcVal >= top && arcVal > sesPeak + span * 0.01) { sesPeak = arcVal; peakLitT = 1.5; }
  }

  // peak hold: follows the arc up, waits, then falls back
  var pos = (powered && bootT < 0) ? ledPos(arcVal) : 0;
  if (pos >= peakPos) { peakPos = pos; peakTimer = 0; }
  else {
    peakTimer += dt;
    if (peakTimer > cfg.peakHold) peakPos = Math.max(pos, peakPos - dt * cfg.ledCount * 1.2);
  }
  render();
}

// ---- BeamNG gauge API (called by lua/vehicle/controller/gauges/genericGauges.lua) ----
function setup(config) {
  if (config) {
    for (var k in cfg) {
      if (config[k] !== undefined && config[k] !== null) {
        cfg[k] = (typeof cfg[k] === "number" || NUMERIC[k]) && !isNaN(Number(config[k])) ? Number(config[k]) : config[k];
      }
    }
  }
  if (isTemp()) {
    tempF = !!config && String(config.uiUnitTemperature || "c").toLowerCase() === "f";
    cfg.unitLabel = tempF ? "\u00b0F" : "\u00b0C";
    setDigits(cfg.source === "egt" && tempF ? 4 : 3);   // exhaust temp in deg F reaches 4 digits
  } else if (cfg.source === "fuel") {
    cfg.decimals = 0;
    cfg.unitLabel = "%";
  } else if (cfg.source === "rpm") {
    cfg.decimals = 1;
    cfg.unitLabel = "x1000";
    if (!config || config.warnValue === undefined || config.warnValue === null) cfg.warnValue = 0;   // no digit flash unless set
  } else {
    var u = String(cfg.unit || "auto").toLowerCase();
    if (u === "auto") u = String((config && config.uiUnitPressure) || "psi").toLowerCase();
    pUnit = (u === "bar") ? "bar" : (u === "kpa" ? "kpa" : "psi");      // anything else (psi, inHg) reads in PSI
    cfg.decimals = pUnit === "bar" ? 2 : (pUnit === "kpa" ? 0 : 1);
    cfg.unitLabel = pUnit === "bar" ? "BAR" : (pUnit === "kpa" ? "kPa" : "PSI");
  }
  if (cfg.nightBrightness > 1) cfg.nightBrightness = cfg.nightBrightness / 100;   // tuning slider is in percent
  if (cfg.shiftAt > 1) cfg.shiftAt = cfg.shiftAt / 100;
  buildLayers();
  lastKey = "";
  render();
}

function updateData(data) {
  var e = (data && data.electrics) || {};
  var turbo = Number(e.turboBoost) || 0, sc = Number(e.superchargerBoost) || 0;
  target = (sc > 0 ? Math.max(turbo, sc) : turbo) * cfg.unitScale;
  // the game fills a missing electrics value with 0, so the mod's module says which ones the car
  // doesn't have (and leaves out the exhaust temperature when there is none)
  var am0 = data && data.customModules && data.customModules.dbgAmbient, miss = am0 && am0.missing;
  if (miss && typeof miss === "object") {
    haveNow = cfg.source === "egt" ? (am0.egt !== undefined && am0.egt !== null) :
              cfg.source === "boost" ? !(miss.turboBoost && miss.superchargerBoost) : !miss[cfg.source];
  } else haveNow = true;   // no word from the module: can't tell, show the value
  // engine not turning: the manifold is at atmospheric pressure, so the gauge must read zero
  // (the game keeps reporting a little vacuum with the engine stopped)
  var stopped = (e.engineRunning !== undefined && e.engineRunning !== null && !(Number(e.engineRunning) > 0)) ||
                (e.rpm !== undefined && e.rpm !== null && Number(e.rpm) < 50);
  if (stopped) target = 0;
  var rpm = Number(e.rpm) || 0, maxRpm = Number(e.maxrpm) || 0;
  shifting = (cfg.source === "boost" || cfg.source === "rpm") && cfg.shiftLight > 0 && !stopped && maxRpm > 0 && rpm >= maxRpm * cfg.shiftAt;
  if (cfg.source === "rpm") {
    target = stopped ? 0 : rpm;
    overRev = !stopped && maxRpm > 0 && rpm >= maxRpm * cfg.shiftAt;
    if (maxRpm !== autoRpm) { autoRpm = maxRpm; lastKey = ""; }
  }
  if (cfg.source === "oiltemp") target = Number(e.oiltemp) || 0;
  if (cfg.source === "watertemp") target = Number(e.watertemp) || 0;
  if (cfg.source === "egt") {
    var em = data && data.customModules && data.customModules.dbgAmbient;
    target = (em && Number(em.egt)) || 0;
  }
  if (cfg.source === "fuel") {
    var f = Number(e.fuel) || 0;               // the game gives the tank level as 0..1
    target = f > 1.5 ? f : f * 100;
  }
  lights = Math.max(Number(e.lights) || 0, Number(e.lowhighbeam) || 0);
  var am = data && data.customModules && data.customModules.dbgAmbient;
  ambient = (am && typeof am.light === "number") ? Math.max(0, Math.min(1, am.light)) : 1;
  if (ambShown < 0 && am && typeof am.light === "number") ambShown = ambient;
  var lim = (am && typeof am.maxBoost === "number" && am.maxBoost > 0) ? am.maxBoost : 0;
  if (cfg.source === "boost" && lim !== autoLimit) {
    autoLimit = lim; lastKey = "";
  }
  if (am && typeof am.resets === "number") {      // the car was reset: cancel any shut-down sweep
    if (resets !== null && am.resets !== resets) { quietT = 1; offT = -1; lastKey = ""; }
    resets = am.resets;
  }
  var ign = e.ignitionLevel;
  powered = (ign === undefined || ign === null) ? true : (Number(ign) >= 1);
  tick();
}

function updateMode(data) {}

buildLayers();
render();
// animate between game updates so the arc glides instead of stepping
setInterval(tick, 16);
</script>
</body>
</html>
